name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: pnpm install && pnpm test
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: web/dist
  api:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:17
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - run: go test ./...
        env:
          TOKEN: ${{ secrets.TOKEN }}
