name: CID011
on: pull_request
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: npm test
        env:
          API_KEY: ${{ secrets.API_KEY }}
  guarded:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - run: npm test
        env:
          API_KEY: ${{ secrets.API_KEY }}
