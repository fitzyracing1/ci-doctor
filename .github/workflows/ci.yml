name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/ is up to date
        if: matrix.node == '24'
        run: |
          npm run build
          git diff --exit-code dist/ || { echo "::error::dist/index.js is stale. Run npm run build and commit it."; exit 1; }
